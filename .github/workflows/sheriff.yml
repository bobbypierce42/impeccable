name: PR Sheriff

on:
  issues:
    types: [opened, reopened]
  schedule:
    # Daily UTC afternoon pass. The script uses an aggressive 7/14 day window:
    # warn contributor-blocked PRs after 7 days open, close after 14.
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print planned changes without mutating GitHub"
        type: boolean
        default: false

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-sheriff
  cancel-in-progress: false

jobs:
  issue-inbox:
    if: github.event_name == 'issues'
    runs-on: kalana-ci
    timeout-minutes: 15
    steps:
      - name: Set up GitHub CLI without root privileges
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) cli_arch=amd64 ;;
            aarch64|arm64) cli_arch=arm64 ;;
            *) echo "::error::Unsupported GitHub CLI architecture"; exit 1 ;;
          esac
          cli_version=2.103.0
          cli_package="gh_${cli_version}_linux_${cli_arch}.tar.gz"
          cli_dir="$(mktemp -d "$RUNNER_TEMP/gh-cli.XXXXXX")"
          cli_url="https://github.com/cli/cli/releases/download/v${cli_version}"
          curl -fsSL --retry 3 "$cli_url/$cli_package" -o "$cli_dir/$cli_package"
          curl -fsSL --retry 3 "$cli_url/gh_${cli_version}_checksums.txt" -o "$cli_dir/checksums.txt"
          (cd "$cli_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$cli_dir/$cli_package" -C "$cli_dir"
          echo "$cli_dir/gh_${cli_version}_linux_${cli_arch}/bin" >> "$GITHUB_PATH"
      - name: Mark issue for triage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create "needs triage" \
            --repo "$GH_REPO" \
            --color "d4c5f9" \
            --description "New or reopened issue awaiting maintainer triage" \
            --force
          gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-label "needs triage"

  sheriff:
    if: github.event_name != 'issues'
    runs-on: kalana-ci
    timeout-minutes: 15
    steps:
      - name: Set up GitHub CLI without root privileges
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) cli_arch=amd64 ;;
            aarch64|arm64) cli_arch=arm64 ;;
            *) echo "::error::Unsupported GitHub CLI architecture"; exit 1 ;;
          esac
          cli_version=2.103.0
          cli_package="gh_${cli_version}_linux_${cli_arch}.tar.gz"
          cli_dir="$(mktemp -d "$RUNNER_TEMP/gh-cli.XXXXXX")"
          cli_url="https://github.com/cli/cli/releases/download/v${cli_version}"
          curl -fsSL --retry 3 "$cli_url/$cli_package" -o "$cli_dir/$cli_package"
          curl -fsSL --retry 3 "$cli_url/gh_${cli_version}_checksums.txt" -o "$cli_dir/checksums.txt"
          (cd "$cli_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$cli_dir/$cli_package" -C "$cli_dir"
          echo "$cli_dir/gh_${cli_version}_linux_${cli_arch}/bin" >> "$GITHUB_PATH"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run sheriff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="--apply"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            mode="--dry-run"
          fi

          node scripts/github/sheriff.mjs "$mode" \
            --repo "$GITHUB_REPOSITORY" \
            --warning-days 7 \
            --close-days 14 \
            --maintainers "pbakaus" \
            --regular-contributors "pbakaus,abdulwahabone" \
            --auto-close-regulars
